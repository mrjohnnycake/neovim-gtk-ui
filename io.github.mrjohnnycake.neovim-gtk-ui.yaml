app-id: io.github.mrjohnnycake.neovim-gtk-ui
runtime: org.gnome.Platform
runtime-version: '45'
sdk: org.gnome.Sdk
sdk-extensions:
- org.freedesktop.Sdk.Extension.rust-stable
command: neovim-gtk-ui
finish-args:
- --share=ipc
- --socket=fallback-x11
- --socket=wayland
- --device=dri
- --socket=session-bus # for `flatpak-spawn --host nvim`
build-options:
  append-path: "/usr/lib/sdk/rust-stable/bin"
  build-args:
  - "--share=network" # for cargo fetching dependencies
  env:
    CARGO_HOME: "/run/build/neovim-gtk-ui" # for caching
    CARGO_ARGS: "--features flatpak"
    PREFIX: "/app"
modules:
- name: neovim-gtk-ui
  buildsystem: simple
  build-commands:
  - make install-flatpak
  sources:
  - type: archive
    url: https://github.com/mrjohnnycake/neovim-gtk-ui/archive/b9cc9d19f19a5ee07dc20c66eb022549fe5294c3.tar.gz
    sha256: bcba92003aa5739bfef2476be324b5a2005eb9084dca64a2d9d7e7c7e9d82511
